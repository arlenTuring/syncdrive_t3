<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SyncDrive T3 本地模擬器</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="top">
    <div>
      <h1>本地模擬器</h1>
      <p class="sub">以自駕車身分連上 SyncDrive T3：收訂單、跑路線、回報狀態</p>
    </div>
    <div class="target-badge" id="targetBadge">—</div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="control">模擬控制</button>
    <button class="tab" data-tab="routes">路線路徑</button>
  </nav>

  <main data-panel="control">
    <section class="card">
      <h2>一、連線目標</h2>
      <p class="hint">模擬器是外部單位：只用對外 API（金鑰）與 MQTT（每台車一組帳密）。圖資讀本機的 data/map.json，不跟伺服器要。</p>
      <div class="row">
        <label>預設
          <select id="presetSelect"></select>
        </label>
        <label>位址
          <input id="hostInput" type="text" placeholder="34.80.84.224" />
        </label>
        <label>MQTT
          <input id="mqttPortInput" type="number" />
        </label>
        <label>對外 API
          <input id="externalPortInput" type="number" />
        </label>
      </div>
      <div class="row">
        <button id="applyTargetBtn" class="btn">套用目標</button>
        <button id="probeBtn" class="btn ghost">測試對外通道</button>
      </div>
      <div id="credWarn" class="warn" hidden></div>
      <ul id="probeResults" class="probe"></ul>
    </section>

    <section class="card">
      <h2>二、車隊</h2>
      <div class="row">
        <button id="startBtn" class="btn primary">車隊上線</button>
        <button id="stopBtn" class="btn danger">車隊下線</button>
        <label>倍速
          <select id="speedSelect">
            <option value="1">1×（真實時間）</option>
            <option value="2">2×</option>
            <option value="5">5×</option>
            <option value="10">10×</option>
            <option value="30">30×</option>
          </select>
        </label>
      </div>
      <p class="hint">
        倍速壓縮的是計畫時間，不是車速——各段的相對長短仍與班表一致。
      </p>
      <div id="fleetInfo" class="hint"></div>
      <table class="fleet">
        <thead>
          <tr>
            <th>車輛</th><th>連線</th><th>訂單</th><th>路徑</th>
            <th>進度</th><th>電量</th><th>異常模擬</th>
          </tr>
        </thead>
        <tbody id="fleetBody">
          <tr><td colspan="7" class="empty">車隊未上線</td></tr>
        </tbody>
      </table>
    </section>

    <section class="card">
      <h2>三、事件</h2>
      <div class="row">
        <label class="inline"><input type="checkbox" id="onlyOrders" /> 只看訂單與異常</label>
        <button id="clearLogBtn" class="btn ghost">清畫面</button>
      </div>
      <div id="log" class="log"></div>
    </section>
  </main>

  <!--
    路徑編輯器是獨立的一頁（simulator/web，用 React 建置）。

    它直接重用 syncdrive_t3 前端的 MapAreaCanvas——也就是地圖編輯器的圖台本體，
    所以方塊、站台、號誌、顏色都與地圖編輯器完全一致，不是照著描一個像的。
    那頁需要 React 與 Tailwind，和這一頁的原生 JS 混不進同一份 bundle，
    所以用 iframe 掛進來（同源，沒有跨網域問題）。
  -->
  <main data-panel="routes" class="full-bleed" hidden>
    <iframe id="routeFrame" class="route-frame" title="路線路徑編輯器"></iframe>
  </main>

  <script src="/app.js"></script>
  <script src="/routes.js"></script>
</body>
</html>
