# ───────────────────────────────────────────────────────────────
# 正式環境 Mosquitto 設定：實作協議 §三 的 ACL 隔離原則。
#
# 兩個 listener，權責分開：
#
#   8883  車端。TLS ＋ 用戶端憑證，對外開放。
#   1883  中心端後端。只在 docker 內部網路，compose 不對主機發布這個埠。
#
# per_listener_settings 必須是 true——兩個 listener 的認證方式不同（一邊看憑證、
# 一邊看帳密），沒有它的話 mosquitto 會把設定套用到全部 listener 上。
# 開啟之後 acl_file 也要逐個 listener 指定，而匿名開關要寫成
# listener_allow_anonymous——寫成 allow_anonymous 雖然還能動，但 mosquitto 會
# 每次啟動都警告，2.x 之後會移除。
# ───────────────────────────────────────────────────────────────

per_listener_settings true

# ── 車端：TLS ＋ 用戶端憑證（對外）──────────────────────────────
#
# require_certificate 讓 broker 拒絕沒有憑證的連線；use_identity_as_username
# 把憑證的 CN 當成 username，於是 ACL 那條 pattern write v1/vtms/%u/# 原封不動
# 繼續生效，而「這台車是誰」由 CA 的簽章決定，不是由一段可複製的密碼決定。
#
# 這個 listener 沒有 password_file：憑證本身就是身分，再要一次密碼沒有增加安全性，
# 只是多一個會外流的字串。
listener 8883
# 信任鏈要同時含根與中介：根讓 broker 自己的伺服器憑證成鏈，中介用來驗證
# 中心端即時簽出去的車輛憑證。少了中介，每一張車輛憑證都會驗不過。
cafile /mosquitto/certs/ca-chain.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
require_certificate true
use_identity_as_username true
listener_allow_anonymous false
acl_file /mosquitto/config/aclfile

# ── 中心端後端：只在 docker 內部網路 ────────────────────────────
#
# 後端與 broker 在同一個 compose 網路裡，這個埠不對主機發布，外面連不到。
# 保留帳密而不是也發一張憑證，是因為它的憑證要放進後端映像或掛進容器，
# 增加的攻擊面比它擋掉的多——這條連線本來就沒有離開過 docker 網路。
listener 1883
listener_allow_anonymous false
password_file /mosquitto/config/passwordfile
acl_file /mosquitto/config/aclfile

# 僅輸出錯誤，避免 log volume 膨脹
log_dest stdout
log_type error
