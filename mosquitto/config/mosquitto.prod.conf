# ───────────────────────────────────────────────────────────────
# 正式環境 Mosquitto 設定：實作協議 §三 的 ACL 隔離原則。
# 啟用方式：docker-compose 將 mosquitto 的設定掛載指向本檔，
#   例如 volumes: ./mosquitto/config/mosquitto.prod.conf:/mosquitto/config/mosquitto.conf
# 先依下方 README 產生 passwordfile 後再啟用，否則所有連線都會被拒。
# ───────────────────────────────────────────────────────────────

listener 1883
listener 9001
protocol websockets

# 關閉匿名連線，所有 client 必須帶帳密
allow_anonymous false
password_file /mosquitto/config/passwordfile
acl_file /mosquitto/config/aclfile

# 僅輸出錯誤，避免 log volume 膨脹
log_dest stdout
log_type error
