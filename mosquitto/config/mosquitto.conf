# 開發用：保留 1883／9001 匿名（後端與本機工具），並加 8883 TLS
# 供模擬器／車端走與正式環境相同的客戶端憑證流程。
#
# per_listener_settings 必須為 true——各 listener 認證方式不同。

per_listener_settings true

# ── 後端／本機工具：匿名（僅本機）────────────────────────────
listener 1883
listener_allow_anonymous true

listener 9001
protocol websockets
listener_allow_anonymous true

# ── 車端（含模擬器）：TLS ＋ 客戶端憑證 ───────────────────────
# 憑證由 deploy/mqtt-certs.sh 產生；MQTT_CERT_DIR 指向 mosquitto/certs。
listener 8883
cafile /mosquitto/certs/ca-chain.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
require_certificate true
use_identity_as_username true
listener_allow_anonymous false
acl_file /mosquitto/config/aclfile

# 僅輸出錯誤，避免 mosquitto_log volume 膨脹
log_dest stdout
log_type error
