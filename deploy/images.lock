# 基底映像鎖定檔
#
# 每一行：<用途> <image:tag> <manifest-list digest>
#
# 為什麼要釘 digest 而不是只寫 tag：tag 是<strong>可變的</strong>。
# `node:20-alpine` 今天拉到的與下個月拉到的不是同一份，`redis:7-alpine` 也一樣。
# 只寫 tag 的話，同一份原始碼在不同日子建出來的映像內容不同——這正是「拿到現場
# 才發現跟測試時不一樣」的來源，而那種問題最難查，因為程式碼完全沒動。
#
# 這裡記的是 <strong>manifest list</strong> 的 digest，不是單一架構的 digest，
# 所以 amd64 與 arm64 共用同一行；docker 會自己挑對應架構的那一層。
#
# 更新方式（有意識地升級時才做，並且要重新完整測一輪）：
#   ./deploy/refresh-images-lock.sh

node-build      node:20-alpine                      sha256:fb4cd12c85ee03686f6af5362a0b0d56d50c58a04632e6c0fb8363f609372293
