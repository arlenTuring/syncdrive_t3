# SyncDrive T3 前端與文件站
#
# 兩個 server：一個給我方（80），一個給協力廠商（3100）。兩者<strong>各自有帳密、
# 各自有文件根目錄</strong>——內部文件不是靠權限擋在對外那一側，而是那一側的
# 檔案系統裡根本沒有那些檔案（見 deploy/Dockerfile.web）。
#
# 這個分法的用意：權限設定會改錯，檔案不存在不會。

# ── 內部（80）─────────────────────────────────────────────
server {
  listen 80;
  server_name _;

  # 上傳／回應大小要跟後端 REQUEST_BODY_LIMIT 對齊，否則班表 body 會被 nginx 擋掉
  # 單檔上限 20 MiB，另保留 multipart 欄位與 boundary 的空間。
  client_max_body_size 21m;

  # 圖台、內部 API 與即時推播<strong>不再掛 Basic Auth</strong>，改由系統帳號登入保護：
  # 後端 AccessGuard 依 Session 與權限把關（未登入回 401），socket.io 連線同樣要有效 Session。
  #
  # 兩層疊在一起會出事（2026-10-19）：後端回「未登入」的 401 時，瀏覽器會把記住的
  # Basic 帳密當成被拒而丟掉，下一個請求就被 nginx 擋下並跳出原生帳密視窗，
  # 前端又因 401 重查登入狀態，變成無限跳視窗。
  #
  # Basic Auth 只留在下面這幾個「系統結構地圖」：內部入口、內部 Swagger、技術文件。

  # 健康檢查：只回答「服務在不在」
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  gzip on;
  gzip_types application/json application/javascript text/css text/plain image/svg+xml;
  gzip_min_length 1024;

  # 內部整合入口：要帳密。它列出內部文件與 Swagger 的位置，本身就是一張
  # 系統結構的地圖，不該讓不相干的人看到。
  location = /portal {
    auth_basic "SyncDrive T3 內部文件";
    auth_basic_user_file /etc/nginx/.htpasswd;
    root /usr/share/nginx/portal;
    try_files /internal.html =404;
  }

  # 廠商入口的預覽：用同一份檔案，方便對照「廠商到底看得到什麼」
  location = /external-preview {
    auth_basic "SyncDrive T3 內部文件";
    auth_basic_user_file /etc/nginx/.htpasswd;
    root /usr/share/nginx/portal;
    try_files /external.html =404;
  }

  location /syncdrive-api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
  }

  # 內部 Swagger：列出全部 82 支端點，等於把系統結構攤開，要帳密
  location /api/docs {
    auth_basic "SyncDrive T3 內部文件";
    auth_basic_user_file /etc/nginx/.htpasswd;
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /socket.io/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  # 完整技術文件中心：排班演算法全覽、資料表關聯、開發進度、會議紀錄。
  # 這裡是這個埠上唯一真正需要保護的東西。
  location /docs/ {
    auth_basic "SyncDrive T3 內部文件";
    auth_basic_user_file /etc/nginx/.htpasswd;
    alias /usr/share/nginx/docs/;
    index index.html;
    charset utf-8;
  }

  # index.html 每次都向伺服器確認（資產檔名帶雜湊，可以照常快取）。沒有這一條時瀏覽器會依
  # Last-Modified 自行快取 index.html，部署後仍載入舊版的資產，畫面跟部署機的程式對不上。
  location = /index.html {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache" always;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }
}

# ── 對外（3100）───────────────────────────────────────────
server {
  listen 3100;
  server_name _;

  client_max_body_size 20m;
  gzip on;
  gzip_types application/json text/plain;
  gzip_min_length 1024;

  # 入口頁、文件與 Swagger 需要瀏覽帳號——不是知道埠號就能進來。
  auth_basic "SyncDrive T3 對外介面";
  auth_basic_user_file /etc/nginx/.htpasswd-external;

  location = /healthz {
    auth_basic off;
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # API 本體不套 Basic Auth。
  #
  # 那是機器對機器的介面，契約寫的是 x-api-key（規格書第二章）；再疊一層瀏覽器
  # 帳密會讓對方要維護兩組憑證，而且與已經交付的規格不符。認證由後端負責，
  # 這裡只轉發。
  location /syncdrive-api/ {
    auth_basic off;
    proxy_pass http://backend:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
  }

  # 對外 Swagger：由後端的對外埠提供，內容只有掛 @ExternalApi 的端點
  location /api/docs/public {
    proxy_pass http://backend:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # 對外文件站：目錄裡只有三份對外文件，內部文件不在這個檔案系統裡
  location /docs/ {
    alias /usr/share/nginx/public-docs/;
    index index.html;
    charset utf-8;
  }

  # 用 root + try_files 而不是 alias：exact-match location 對單一檔案下 alias
  # 會回 500（2026-08-26 實測）
  location = / {
    root /usr/share/nginx/portal;
    try_files /external.html =404;
  }

  # 其餘一律當作不存在——不洩漏「這條路徑存在但你沒權限」
  location / {
    return 404;
  }
}
