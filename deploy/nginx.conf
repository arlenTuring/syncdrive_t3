# SyncDrive T3 前端與文件站
#
# 兩個 server：一個給我方（80），一個給協力廠商（3100）。兩者<strong>各自有帳密、
# 各自有文件根目錄</strong>——內部文件不是靠權限擋在對外那一側，而是那一側的
# 檔案系統裡根本沒有那些檔案（見 deploy/Dockerfile.web）。
#
# 這個分法的用意：權限設定會改錯，檔案不存在不會。

# ── 內部（80）─────────────────────────────────────────────
server {
  listen 80;
  server_name _;

  # 上傳／回應大小要跟後端 REQUEST_BODY_LIMIT 對齊，否則班表 body 會被 nginx 擋掉
  client_max_body_size 20m;

  # <strong>整個埠都要帳密。</strong>
  #
  # 這一側後面是圖台、內部 API、技術文件與內部 Swagger。內部 API 本身沒有任何
  # 認證——任何打得到的人都能讀寫班表、地圖與時間模板——所以在沒有帳號權限系統
  # 之前（milestone 5），這道 Basic Auth 是唯一的保護。
  #
  # 曾經只把帳密掛在文件上、靠防火牆白名單擋圖台與 API。那在固定 IP 的環境成立，
  # 但這裡是浮動 IP：2026-08-26 對外 IP 一換，圖台就整個連不上。改成帳密之後
  # 任何地點都能登入，代價是每個人第一次要輸入一次帳密（瀏覽器會記住）。
  #
  # 圖台的 API 呼叫是同源的，瀏覽器通過驗證後會自動帶上，前端不必改任何東西。
  # 外層：圖台與內部 API。內部與廠商兩個帳號都能進。
  auth_basic "SyncDrive T3 系統";
  auth_basic_user_file /etc/nginx/.htpasswd-web;

  # 健康檢查不需要帳密：它要問的是「服務在不在」，不是「你有沒有權限」
  location = /healthz {
    auth_basic off;
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  gzip on;
  gzip_types application/json application/javascript text/css text/plain image/svg+xml;
  gzip_min_length 1024;

  # 內部整合入口：要帳密。它列出內部文件與 Swagger 的位置，本身就是一張
  # 系統結構的地圖，不該讓不相干的人看到。
  location = /portal {
    auth_basic "SyncDrive T3 內部文件";
    auth_basic_user_file /etc/nginx/.htpasswd;
    root /usr/share/nginx/portal;
    try_files /internal.html =404;
  }

  # 廠商入口的預覽：用同一份檔案，方便對照「廠商到底看得到什麼」
  location = /external-preview {
    auth_basic "SyncDrive T3 內部文件";
    auth_basic_user_file /etc/nginx/.htpasswd;
    root /usr/share/nginx/portal;
    try_files /external.html =404;
  }

  location /syncdrive-api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
  }

  # 內部 Swagger：列出全部 82 支端點，等於把系統結構攤開，要帳密
  location /api/docs {
    auth_basic "SyncDrive T3 內部文件";
    auth_basic_user_file /etc/nginx/.htpasswd;
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /socket.io/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  # 完整技術文件中心：排班演算法全覽、資料表關聯、開發進度、會議紀錄。
  # 這裡是這個埠上唯一真正需要保護的東西。
  location /docs/ {
    auth_basic "SyncDrive T3 內部文件";
    auth_basic_user_file /etc/nginx/.htpasswd;
    alias /usr/share/nginx/docs/;
    index index.html;
    charset utf-8;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }
}

# ── 對外（3100）───────────────────────────────────────────
server {
  listen 3100;
  server_name _;

  client_max_body_size 20m;
  gzip on;
  gzip_types application/json text/plain;
  gzip_min_length 1024;

  # 入口頁、文件與 Swagger 需要瀏覽帳號——不是知道埠號就能進來。
  auth_basic "SyncDrive T3 對外介面";
  auth_basic_user_file /etc/nginx/.htpasswd-external;

  location = /healthz {
    auth_basic off;
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # API 本體不套 Basic Auth。
  #
  # 那是機器對機器的介面，契約寫的是 x-api-key（規格書第二章）；再疊一層瀏覽器
  # 帳密會讓對方要維護兩組憑證，而且與已經交付的規格不符。認證由後端負責，
  # 這裡只轉發。
  location /syncdrive-api/ {
    auth_basic off;
    proxy_pass http://backend:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
  }

  # 對外 Swagger：由後端的對外埠提供，內容只有掛 @ExternalApi 的端點
  location /api/docs/public {
    proxy_pass http://backend:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # 對外文件站：目錄裡只有三份對外文件，內部文件不在這個檔案系統裡
  location /docs/ {
    alias /usr/share/nginx/public-docs/;
    index index.html;
    charset utf-8;
  }

  # 用 root + try_files 而不是 alias：exact-match location 對單一檔案下 alias
  # 會回 500（2026-08-26 實測）
  location = / {
    root /usr/share/nginx/portal;
    try_files /external.html =404;
  }

  # 其餘一律當作不存在——不洩漏「這條路徑存在但你沒權限」
  location / {
    return 404;
  }
}
