# SyncDrive T3 前端與文件站
#
# 兩個 server：一個給我方（80），一個給協力廠商（3100）。兩者<strong>各自有帳密、
# 各自有文件根目錄</strong>——內部文件不是靠權限擋在對外那一側，而是那一側的
# 檔案系統裡根本沒有那些檔案（見 deploy/Dockerfile.web）。
#
# 這個分法的用意：權限設定會改錯，檔案不存在不會。

# ── 內部（80）─────────────────────────────────────────────
server {
  listen 80;
  server_name _;

  # 上傳／回應大小要跟後端 REQUEST_BODY_LIMIT 對齊，否則班表 body 會被 nginx 擋掉
  client_max_body_size 20m;

  # <strong>帳密只掛在文件上，不掛在整個埠。</strong>
  #
  # 圖台是給現場人員直接開的，套帳密等於每個人每次都要輸入一次；而圖台在瀏覽器裡
  # 就是靠內部 API 運作，鎖了 API 圖台也活不了。要保護的是<strong>演算法與系統結構</strong>
  # ——那些在文件與內部 Swagger 裡，不在圖台畫面上。
  #
  # 代價要講清楚：內部 API 因此是<strong>無認證</strong>的，任何能連到這個埠的人都能
  # 讀寫班表、地圖與時間模板。要收緊的話應該從網路層做（防火牆限制來源網段），
  # 而不是在這裡加一道會把圖台一起擋掉的帳密。

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  gzip on;
  gzip_types application/json application/javascript text/css text/plain image/svg+xml;
  gzip_min_length 1024;

  # 內部整合入口
  location = /portal {
    root /usr/share/nginx/portal;
    try_files /internal.html =404;
  }

  # 廠商入口的預覽：用同一份檔案，方便對照「廠商到底看得到什麼」
  location = /external-preview {
    root /usr/share/nginx/portal;
    try_files /external.html =404;
  }

  location /syncdrive-api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
  }

  # 內部 Swagger：列出全部 82 支端點，等於把系統結構攤開，要帳密
  location /api/docs {
    auth_basic "SyncDrive T3 內部文件";
    auth_basic_user_file /etc/nginx/.htpasswd;
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /socket.io/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  # 完整技術文件中心：排班演算法全覽、資料表關聯、開發進度、會議紀錄。
  # 這裡是這個埠上唯一真正需要保護的東西。
  location /docs/ {
    auth_basic "SyncDrive T3 內部文件";
    auth_basic_user_file /etc/nginx/.htpasswd;
    alias /usr/share/nginx/docs/;
    index index.html;
    charset utf-8;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }
}

# ── 對外（3100）───────────────────────────────────────────
server {
  listen 3100;
  server_name _;

  client_max_body_size 20m;
  gzip on;
  gzip_types application/json text/plain;
  gzip_min_length 1024;

  # 入口頁、文件與 Swagger 需要瀏覽帳號——不是知道埠號就能進來。
  auth_basic "SyncDrive T3 對外介面";
  auth_basic_user_file /etc/nginx/.htpasswd-external;

  location = /healthz {
    auth_basic off;
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # API 本體不套 Basic Auth。
  #
  # 那是機器對機器的介面，契約寫的是 x-api-key（規格書第二章）；再疊一層瀏覽器
  # 帳密會讓對方要維護兩組憑證，而且與已經交付的規格不符。認證由後端負責，
  # 這裡只轉發。
  location /syncdrive-api/ {
    auth_basic off;
    proxy_pass http://backend:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
  }

  # 對外 Swagger：由後端的對外埠提供，內容只有掛 @ExternalApi 的端點
  location /api/docs/public {
    proxy_pass http://backend:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # 對外文件站：目錄裡只有三份對外文件，內部文件不在這個檔案系統裡
  location /docs/ {
    alias /usr/share/nginx/public-docs/;
    index index.html;
    charset utf-8;
  }

  # 用 root + try_files 而不是 alias：exact-match location 對單一檔案下 alias
  # 會回 500（2026-08-26 實測）
  location = / {
    root /usr/share/nginx/portal;
    try_files /external.html =404;
  }

  # 其餘一律當作不存在——不洩漏「這條路徑存在但你沒權限」
  location / {
    return 404;
  }
}
