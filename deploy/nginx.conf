# SyncDrive T3 前端與文件站
#
# 兩個 server：一個給我方（80），一個給協力廠商（3100）。兩者<strong>各自有帳密、
# 各自有文件根目錄</strong>——內部文件不是靠權限擋在對外那一側，而是那一側的
# 檔案系統裡根本沒有那些檔案（見 deploy/Dockerfile.web）。
#
# 這個分法的用意：權限設定會改錯，檔案不存在不會。

# ── 內部（80）─────────────────────────────────────────────
server {
  listen 80;
  server_name _;

  # 上傳／回應大小要跟後端 REQUEST_BODY_LIMIT 對齊，否則班表 body 會被 nginx 擋掉
  client_max_body_size 20m;

  # 內部這一側後面是全部內部 API，那些端點沒有金鑰保護。這道 Basic Auth 是
  # 「這個埠對外開放」與「內部 API 無保護」之間唯一的東西。
  auth_basic "SyncDrive T3 內部系統";
  auth_basic_user_file /etc/nginx/.htpasswd;

  # 容器健康檢查專用：不需要帳密。Basic Auth 一開，原本打 / 的健康檢查就變成
  # 401、容器被判定不健康——nginx 明明活得好好的（2026-08-26 實測）。
  # 健康檢查要問的是「服務在不在」，不是「你有沒有權限」。
  location = /healthz {
    auth_basic off;
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  gzip on;
  gzip_types application/json application/javascript text/css text/plain image/svg+xml;
  gzip_min_length 1024;

  # 內部整合入口
  location = /portal {
    root /usr/share/nginx/portal;
    try_files /internal.html =404;
  }

  # 廠商入口的預覽：用同一份檔案，方便對照「廠商到底看得到什麼」
  location = /external-preview {
    root /usr/share/nginx/portal;
    try_files /external.html =404;
  }

  location /syncdrive-api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
  }

  location /api/docs {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /socket.io/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  # 完整技術文件中心
  location /docs/ {
    alias /usr/share/nginx/docs/;
    index index.html;
    charset utf-8;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }
}

# ── 對外（3100）───────────────────────────────────────────
server {
  listen 3100;
  server_name _;

  client_max_body_size 20m;
  gzip on;
  gzip_types application/json text/plain;
  gzip_min_length 1024;

  # 入口頁、文件與 Swagger 需要瀏覽帳號——不是知道埠號就能進來。
  auth_basic "SyncDrive T3 對外介面";
  auth_basic_user_file /etc/nginx/.htpasswd-external;

  location = /healthz {
    auth_basic off;
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # API 本體不套 Basic Auth。
  #
  # 那是機器對機器的介面，契約寫的是 x-api-key（規格書第二章）；再疊一層瀏覽器
  # 帳密會讓對方要維護兩組憑證，而且與已經交付的規格不符。認證由後端負責，
  # 這裡只轉發。
  location /syncdrive-api/ {
    auth_basic off;
    proxy_pass http://backend:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
  }

  # 對外 Swagger：由後端的對外埠提供，內容只有掛 @ExternalApi 的端點
  location /api/docs/public {
    proxy_pass http://backend:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # 對外文件站：目錄裡只有三份對外文件，內部文件不在這個檔案系統裡
  location /docs/ {
    alias /usr/share/nginx/public-docs/;
    index index.html;
    charset utf-8;
  }

  # 用 root + try_files 而不是 alias：exact-match location 對單一檔案下 alias
  # 會回 500（2026-08-26 實測）
  location = / {
    root /usr/share/nginx/portal;
    try_files /external.html =404;
  }

  # 其餘一律當作不存在——不洩漏「這條路徑存在但你沒權限」
  location / {
    return 404;
  }
}
