server {
  listen 80;
  server_name _;

  # 上傳／回應大小要跟後端 REQUEST_BODY_LIMIT 對齊，否則班表 body 會被 nginx 擋掉
  client_max_body_size 20m;

  # ── 存取控制 ───────────────────────────────────────────────
  # 80 埠後面是我方前端、內部 Swagger，以及<strong>全部內部 API</strong>——那些端點
  # 沒有金鑰保護，任何人打得到就能讀寫班表、地圖與時間模板。這道 Basic Auth 是
  # 「這個埠對外開放」與「內部 API 無保護」之間唯一的東西。
  #
  # 帳密檔由 bootstrap.sh 產生並掛載進來。對外的 3100 埠不經過 nginx，
  # 走的是後端自己的 x-api-key，兩條路各自獨立。
  auth_basic "SyncDrive T3";
  auth_basic_user_file /etc/nginx/.htpasswd;

  gzip on;
  gzip_types application/json application/javascript text/css text/plain image/svg+xml;
  gzip_min_length 1024;

  # ── 內部 API ────────────────────────────────────────────────
  # 走 docker 網路連到後端的 3000。後端的 3000 沒有發布到主機，
  # 所以「內部 API」只能經由這個 nginx 進來；對外那條路是主機上的 3100，
  # 兩條路徑各自對應一份 Swagger，與 ExternalPortGuard 的判定一致。
  location /syncdrive-api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
  }

  # 內部 Swagger
  location /api/docs {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # 圖台即時推播
  location /socket.io/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  # ── 技術文件站 ──────────────────────────────────────────────
  location /docs/ {
    alias /usr/share/nginx/docs/;
    autoindex on;
    charset utf-8;
  }

  # ── 前端 SPA ───────────────────────────────────────────────
  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }
}
