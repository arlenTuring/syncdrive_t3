# SyncDrive T3 正式／預備環境
#
# <strong>與機房無關。</strong>同一份設定要能跑在 GCP VM、也能跑在進場的實體伺服器上，
# 所以這裡不使用任何雲端供應商專屬的東西——沒有受管資料庫、沒有映像倉庫、
# 沒有負載平衡器。差異一律外部化到 deploy/.env，不做成兩份設定檔。
#
# 資料庫日後要獨立一台時：把 DB_HOST 指向那台，並用 --profile 省略內建的
# postgres 服務（見下方 profiles 說明），compose 其餘部分不動。
#
# 與開發用的 docker-compose.yml 三處不同：
#
# 1. 沒有 adminer 與 redis-commander。那兩個是開發工具，直接連得到資料庫與 Redis，
#    放在對外機器上等於開後門。
# 2. 資料庫與 Redis 只綁 127.0.0.1，不對外發布。要進資料庫請走 SSH 通道。
# 3. 只有兩個埠對外：80（我方前端與內部 API，經 nginx）與 3100（協力廠商）。
#    後端的 3000 完全不發布到主機，內部流量一律經由 nginx 的 docker 網路進來。
#
# 用法：docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d

services:
  postgres:
    image: timescale/timescaledb:2.19.3-pg15@sha256:12d8f8ee714b8d20d91ea5380a40b39df4f95b41cf7f516d25de791bf2f7e1f8
    container_name: syncdrive_postgres
    restart: always
    # 內建資料庫，由 deploy/.env 的 COMPOSE_PROFILES=bundled-db 啟用（預設值）。
    # 資料庫獨立到別台時把該變數清空並設定 DB_HOST，這個服務就不會被拉起。
    profiles: ["bundled-db"]
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 4g

  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    container_name: syncdrive_redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512m

  mosquitto:
    image: eclipse-mosquitto:2@sha256:6f8d8a947c506f8a2290ec65cd4bd2bc7cb4d43fb5f6271f861cb013e2ef9797
    container_name: syncdrive_mosquitto
    restart: always
    # 只發布 8883。車端走 TLS ＋ 用戶端憑證，憑證由 deploy/mqtt-certs.sh 產生。
    #
    # 1883 <strong>刻意不對主機發布</strong>：那個 listener 只給同一個 compose 網路裡的
    # 後端用。發布出去等於在 TLS 之外又留一條純文字的路，而攻擊者只要拿到任何一組
    # 帳密就能繞過憑證這道關卡。
    #
    # MQTT_BIND 預設 127.0.0.1，要讓車端連進來才改 0.0.0.0，並在防火牆限制來源網段。
    ports:
      - "${MQTT_BIND:-127.0.0.1}:8883:8883"
    # 明確指定要讀哪一份設定，不要用「把 prod 蓋在 mosquitto.conf 上」的疊法。
    #
    # 疊法會留下一個地雷：容器裡 /mosquitto/config/mosquitto.conf 這個路徑同時被
    # 目錄掛載與檔案掛載覆蓋，而目錄裡那份是<strong>開發用</strong>設定
    # （allow_anonymous true、沒有 password_file）。部署重新解開設定目錄之後，
    # 只要 mosquitto 因為任何原因重讀設定（SIGHUP、容器重建），就可能讀到開發那份
    # ——broker 隨即對全世界開放，而且沒有任何錯誤訊息。實測發過一次 SIGHUP 之後，
    # 匿名與錯誤密碼全部連得上。
    #
    # 改成用不同檔名 ＋ 明確 -c，路徑不再有兩個來源；prod 檔掛不上時 mosquitto
    # 直接起不來，是往安全的方向失敗。
    command: ["/usr/sbin/mosquitto", "-c", "/mosquitto/config/mosquitto.prod.conf"]
    volumes:
      - ../mosquitto/config:/mosquitto/config
      - ../mosquitto/certs:/mosquitto/certs:ro
      - mosquitto_data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "pidof mosquitto || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    image: syncdrive-backend:${IMAGE_TAG:-latest}
    container_name: syncdrive_backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      EXTERNAL_PORT: 3100
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MQTT_URL: mqtt://vtms-backend:${MQTT_BACKEND_PASSWORD}@mosquitto:1883
      VTMS_API_KEY: ${VTMS_API_KEY}
      # 對外金鑰的發放：廠商以這組帳密換金鑰，與 3100 埠的瀏覽帳密同一組。
      # 分兩組的話等於同一個廠商要記兩份，而它們保護的是同一個邊界。
      EXTERNAL_AUTH_USER: ${EXTERNAL_AUTH_USER}
      EXTERNAL_AUTH_PASSWORD: ${EXTERNAL_AUTH_PASSWORD}
      # 發金鑰時當場簽出車輛憑證，所以後端要讀得到中介 CA 的私鑰（唯讀掛載）
      MQTT_CERT_DIR: /mqtt-certs
      MQTT_PUBLIC_HOST: ${MQTT_PUBLIC_HOST:-127.0.0.1}
      MQTT_PUBLIC_PORT: ${MQTT_PUBLIC_PORT:-8883}
      CORS_ORIGIN: ${CORS_ORIGIN}
      DB_SYNCHRONIZE: ${DB_SYNCHRONIZE:-false}
      LOG_LEVEL: ${LOG_LEVEL:-warn}
      TELEMETRY_PERSIST_ALL: ${TELEMETRY_PERSIST_ALL:-0}
      # 容器預設是 UTC，但班表的時刻是<strong>營運當地時間</strong>——時間線上寫
      # 05:05 就是現場的 05:05。不設這一項，調度引擎會把 05:05 當成 UTC，訂單
      # 整整晚八小時才發（2026-08-26 實測）。
      TZ: ${TZ:-Asia/Taipei}
      # 即時調度引擎。預設關閉——沒有車端在線時開啟只會產生一整天沒人執行的訂單。
      DISPATCH_ENABLED: ${DISPATCH_ENABLED:-false}
      DISPATCH_TICK_SECONDS: ${DISPATCH_TICK_SECONDS:-5}
      DISPATCH_LEAD_SECONDS: ${DISPATCH_LEAD_SECONDS:-90}
      DISPATCH_CATCH_UP_SECONDS: ${DISPATCH_CATCH_UP_SECONDS:-300}
      DISPATCH_TASK_TYPES: ${DISPATCH_TASK_TYPES:-passenger,dispatch,maintenance}
    # 兩個埠都不發布到主機：對外流量由 nginx 從 3100 轉進來（它要先過對外那組
    # Basic Auth 才到得了文件與 Swagger）。後端仍然看得到自己的 localPort 是 3100，
    # ExternalPortGuard 的判定不受影響。
    expose:
      - "3000"
      - "3100"
    volumes:
      # 執行期寫入點。已發布地圖存在 /app/data/published-maps（檔案，不是資料表，
      # 見 scripts/map-published-store.js），沒有這個 volume 的話每次重新部署
      # 地圖就會消失——而地圖一消失，班表 API 查得到班次卻查不到停靠點別名。
      - backenddata:/app/data
      # 憑證唯讀掛進來：發金鑰時要當場簽出該車的用戶端憑證。
      #
      # 後端讀得到的是<strong>中介</strong> CA 的私鑰（client-ca.key，群組 1000），
      # 不是根。根私鑰是 600 root，容器內讀不到——後端被攻破時攻擊者能冒充車輛，
      # 但簽不出伺服器憑證，冒充不了 broker。唯讀掛載讓它連改都不能改。
      - ../mosquitto/certs:/mqtt-certs:ro
    # 不對 postgres 下 depends_on：資料庫獨立部署時那個服務根本不存在，
    # 硬相依會讓整個 compose 起不來。連線重試由 TypeORM 自己負責。
    depends_on:
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/syncdrive-api/vehicles').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2g

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    image: syncdrive-web:${IMAGE_TAG:-latest}
    container_name: syncdrive_web
    restart: always
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:3100:3100"
    volumes:
      # 兩組帳密檔，由 bootstrap.sh 產生。缺任何一個 nginx 都會起不來——
      # 那是刻意的：寧可服務起不來，也不要以為有保護但其實沒有。
      - ./.htpasswd:/etc/nginx/.htpasswd:ro
      - ./.htpasswd-web:/etc/nginx/.htpasswd-web:ro
      - ./.htpasswd-external:/etc/nginx/.htpasswd-external:ro
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

# 這裡曾經有一個 simulator 服務（vtms-shift-demo-simulator.js），已移除。
#
# 模擬器是<strong>外部單位</strong>，只有一份，跑在開發者自己的機器上，程式在另一個資料夾 syncdrive_t3_simulator/。
# 產品端不該有任何東西以車輛身分發布 telemetry——那個容器與本機模擬器搶同一批
# PMS-01～11，兩邊輪流蓋掉對方的位置，圖台上的車就散在莫名其妙的地方
# （實測它回報 x=1025，超出圖資 x 上限 900）。

volumes:
  pgdata:
  backenddata:
  redisdata:
  mosquitto_data:
