services:
  postgres:
    image: timescale/timescaledb:2.19.3-pg15
    container_name: syncdrive_postgres
    restart: always
    environment:
      POSTGRES_USER: syncdrive_user
      POSTGRES_PASSWORD: syncdrive_password
      POSTGRES_DB: syncdrive_t3
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syncdrive_user -d syncdrive_t3"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: syncdrive_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: syncdrive_mosquitto
    restart: always
    ports:
      - "1883:1883"
      - "8883:8883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/certs:/mosquitto/certs:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "pidof mosquitto || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s

  # 影像媒體服務（本機開發）：接入、即時 HLS／WebRTC、分段錄影。API／回放只綁本機。
  mediamtx:
    image: bluenviron/mediamtx:1.21.2-ffmpeg@sha256:c0feb4acc548d5f410d57d9046f62dfa355e2abc4098f5243de9e86430c77a95
    container_name: syncdrive_mediamtx
    restart: always
    environment:
      MTX_AUTHINTERNALUSERS_0_PASS: ${VIDEO_MEDIAMTX_PASSWORD:-vtms-local-dev}
      MTX_AUTHINTERNALUSERS_1_PASS: ${VIDEO_PUBLISH_PASSWORD:-publish-local-dev}
      MTX_WEBRTCADDITIONALHOSTS: 127.0.0.1
      VTMS_HOOK_URL: http://host.docker.internal:3000/syncdrive-api/video/internal/segment-complete
      VTMS_HOOK_SECRET: ${VIDEO_HOOK_SECRET:-hook-local-dev}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./deploy/mediamtx/mediamtx.yml:/mediamtx.yml:ro
      - ./backend/data/video/recordings:/recordings
    ports:
      - "127.0.0.1:8554:8554"
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:8889:8889"
      - "8189:8189/udp"
      - "127.0.0.1:9996:9996"
      - "127.0.0.1:9997:9997"

  adminer:
    image: adminer
    container_name: syncdrive_adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: syncdrive_redis_commander
    restart: always
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  mosquitto_data:
  mosquitto_log:
