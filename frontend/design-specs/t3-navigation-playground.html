/* Navigation: original Figma assets + Ant Design Vue Menu behavior. */
.t3-navigation { flex:none; display:flex; flex-direction:column; height:100%; min-height:0; padding-bottom:12px; background-color:var(--surface-sub-background); background-image:radial-gradient(ellipse 80.7142857% 43.4970703% at 0% 100%,rgba(243.693372,101.538904,0,.2) 0%,rgba(0,0,0,.2) 100%); }
.t3-navigation.is-collapsed { padding-left:0; padding-right:0; }
.nav-topbar { flex:none; height:74px; padding:24px 28px 6px; display:flex; flex-direction:row; align-items:center; gap:8px; }
.nav-collapse { flex:none; height:32px; width:24px; padding:4px 0; border:0; background:transparent; display:flex; align-items:center; cursor:pointer; }
.nav-collapse:focus-visible { outline:2px solid var(--border-theme); border-radius:8px; }
.nav-brand { flex:1; min-width:0; height:44px; display:flex; align-items:center; gap:8px; }
.nav-brand img { display:block; flex:none; }
.brand-wordmark { margin-top:2px; }
.is-collapsed .nav-topbar { flex:none; height:106px; padding:24px 16px 6px; display:flex; flex-direction:column; align-items:center; gap:0; }
.is-collapsed .nav-collapse { order:-1; flex:none; width:48px; height:32px; justify-content:center; }
.is-collapsed .nav-brand { flex:none; width:48px; height:44px; display:flex; align-items:center; justify-content:center; gap:0; }
.brand-name { font:500 16px/normal Poppins,var(--font-primary),sans-serif; color:#c4cac4; }
.nav-menu-area { flex:1; min-height:0; display:flex; flex-direction:column; gap:8px; padding:0 16px; }
.is-collapsed .nav-menu-area { padding-left:16px; padding-right:16px; }
.nav-menu-scroll { flex:1; min-height:0; width:calc(100% + 16px); align-self:flex-start; overflow-x:hidden; overflow-y:auto; scrollbar-width:thin; scrollbar-color:var(--border-disabled) transparent; }
/* Scroll rail occupies the existing 16px right inset; menu width stays fixed. */
.nav-menu-scroll::-webkit-scrollbar { width:8px; height:8px; }
.nav-menu-scroll::-webkit-scrollbar-track { background:transparent; }
.nav-menu-scroll::-webkit-scrollbar-thumb { background:var(--border-disabled); border-radius:4px; }
.nav-divider { width:100%; height:1px; flex:none; display:block; overflow:hidden; }
.nav-divider img { display:block; max-width:none; }
#navigation-demo .nav-menu.ant-menu { width:100%; background:transparent!important; border-inline-end:0!important; color:var(--text-secondary); font-family:var(--font-primary); }
#navigation-demo .nav-menu .ant-menu-item,#navigation-demo .nav-menu .ant-menu-submenu-title,.nav-popup .ant-menu-item {
 display:flex; align-items:center; gap:8px; height:48px!important; line-height:20px!important; margin:0!important; width:100%!important; padding:0 12px!important; border-radius:12px!important; color:var(--text-secondary); background:transparent; font-family:var(--font-primary); font-size:16px; font-weight:400; letter-spacing:0;
}
#navigation-demo .nav-menu .ant-menu-title-content,.nav-popup .ant-menu-title-content { flex:1; min-width:0; margin:0!important; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
/* SubMenu renders its title directly, without ant-menu-title-content. */
#navigation-demo .nav-menu .ant-menu-submenu-title > .nav-label {
 flex:1; min-width:0; margin:0!important; margin-inline-start:0!important; margin-inline-end:0!important; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
#navigation-demo .nav-menu .ant-menu-item::after { border:0!important; }
#navigation-demo .nav-menu .ant-menu-sub { background:transparent!important; }
#navigation-demo .nav-menu .ant-menu-sub .ant-menu-item { padding-left:40px!important; }
#navigation-demo .nav-menu .ant-menu-item:hover,#navigation-demo .nav-menu .ant-menu-submenu-title:hover,.nav-popup .ant-menu-item:hover { background:var(--link-standard)!important; }
#navigation-demo .nav-menu .nav-current-group>.ant-menu-submenu-title { color:var(--text-theme); }
#navigation-demo .nav-menu .ant-menu-item-selected,.nav-popup .ant-menu-item-selected { color:var(--text-primary)!important; background:var(--link-tonal)!important; }
#navigation-demo .nav-menu .ant-menu-item-selected:hover,.nav-popup .ant-menu-item-selected:hover { background:var(--link-tonal-hover)!important; }
#navigation-demo .nav-menu .ant-menu-item:active,#navigation-demo .nav-menu .ant-menu-submenu-title:active,.nav-popup .ant-menu-item:active { background:var(--link-standard-hover)!important; color:var(--text-primary)!important; }
#navigation-demo .nav-menu .nav-current-group>.ant-menu-submenu-title:active { color:var(--text-theme-light)!important; }
#navigation-demo .nav-menu .ant-menu-item-selected:active,.nav-popup .ant-menu-item-selected:active { background:var(--link-tonal-pressed)!important; color:var(--text-primary)!important; }
.nav-icon { position:relative; display:flex!important; align-items:center; justify-content:center; flex:none; width:20px!important; min-width:20px!important; height:20px; margin:0!important; }
.nav-icon img { display:block; flex:none; }
.nav-arrow { position:absolute; display:block; right:12px; top:12px; height:24px; width:24px; }
.nav-arrow img { display:block; position:absolute; top:0; left:0; }
.nav-arrow .arrow-hover,.nav-arrow .arrow-pressed { display:none; }
.ant-menu-submenu-title:hover .arrow-default { display:none; }
.ant-menu-submenu-title:hover .arrow-hover { display:block; }
.ant-menu-submenu-title:active .nav-arrow .arrow-default,.ant-menu-submenu-title:active .nav-arrow .arrow-hover { display:none; }
.ant-menu-submenu-title:active .nav-arrow .arrow-pressed { display:block; }
#navigation-demo .nav-menu .ant-menu-submenu-title { padding-right:44px!important; }
#navigation-demo .nav-menu .ant-menu-item:focus-visible,#navigation-demo .nav-menu .ant-menu-submenu-title:focus-visible { outline:2px solid var(--border-theme); outline-offset:-2px; }
#navigation-demo .is-collapsed .nav-menu .ant-menu-item,#navigation-demo .is-collapsed .nav-menu .ant-menu-submenu-title { justify-content:center; padding:0 12px!important; }
#navigation-demo .is-collapsed .nav-menu .ant-menu-title-content,
#navigation-demo .is-collapsed .nav-menu .ant-menu-submenu-title > .nav-label { display:none; }
.nav-help { flex:none; }
.nav-popup .ant-menu { background:var(--surface-sub-background)!important; border:1px solid var(--border-quaternary); border-radius:12px; }
.nav-popup .nav-label { color:inherit; }
.menu-state { display:flex; align-items:center; gap:8px; width:200px; height:48px; padding:0 12px; border-radius:12px; color:var(--text-secondary); background:transparent; }
.menu-state .state-home { flex:none; display:block; }
.menu-state .state-label { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.menu-state .state-arrow { flex:none; display:block; }
.menu-state[data-active^="On-"] { color:var(--text-theme); }
.menu-state[data-state="hover"] { background:var(--link-standard); }
.menu-state[data-state="pressed"] { background:var(--link-standard-hover); color:var(--text-theme-light); }
.menu-state[data-active^="Off-"][data-state="pressed"] { color:var(--text-primary); }
.menu-state[data-active="On"] { background:var(--link-tonal); color:var(--text-primary); }
.menu-state[data-active="On"][data-state="hover"] { background:var(--link-tonal-hover); }
.menu-state[data-active="On"][data-state="pressed"] { background:var(--link-tonal-pressed); }

.nav-icon-glyph { display:block; flex:none; background-color:currentColor; mask-repeat:no-repeat; mask-size:contain; mask-position:center; -webkit-mask-repeat:no-repeat; -webkit-mask-size:contain; -webkit-mask-position:center; }
</style></head><body><main><h1>T3 UI Kit｜Navigation</h1><p class="intro">Ant Design Vue Menu · Figma 原始圖示與 Logo · 可離線開啟</p><p class="source-note"><a href="https://www.figma.com/design/OsaDhOsncK2eM8FE6aAMkF/Syncdrive-UI-Design-Kit?node-id=1889-2549" target="_blank" rel="noopener">Figma 設計來源 ↗</a></p><section class="panel"><h2>Navigation 互動示意</h2><p class="demo-note">可點擊父項目展開子選單、切換頁面及收合側欄。Menu／Submenu 使用 .text-body-m；展開寬 280px，收合寬 80px。</p><div id="navigation-demo"></div></section><section class="panel"><h2>Ant-Inline-Menu｜15 個 Figma 狀態</h2><p class="demo-note">以下固定顯示 Default／Hover／Pressed 外觀。Off／On 表示是否為所在群組，Close／Open 表示子選單收合／展開；On 為實際選取項目。</p><div id="state-gallery"></div></section></main><script>
