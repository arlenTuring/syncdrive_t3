.picker { max-width: 100%; width: 240px; color: var(--text-primary); }

.picker-help { padding: 4px 12px; margin: 0; color: var(--text-tertiary); }
.picker-field {

  display: flex; align-items: center; justify-content: space-between;
  gap: 8px; width: 100%; height: 34px; padding: 6px 12px; border: 0; border-radius: 8px;
  background: var(--picker-bg); box-shadow: inset 0 0 0 .5px var(--picker-border);

}

.picker-field:focus-visible, .picker-panel button:focus-visible { outline: 2px solid var(--border-theme); outline-offset: 1px; }
.picker-panel {
  position: relative; width: max-content; max-width: 100%; border-radius: 12px;

.picker-panel .grid { display: grid; padding: 12px; }

.picker-panel .cell { padding: 4px; height: 40px; background: transparent; border: 0; color: inherit; }

.picker-panel .unit { height: 70px; padding: 16px 8px; }

.picker-panel .time { width: 190px; padding: 4px; display: flex; gap: 0; }

.picker-panel .time-column + .time-column { border-left: 1px solid var(--border-quaternary); }

}

function reset() { committed=null; draft=[]; clock=[0,0,0]; anchor=normalize({unit:'date'},new Date()); drill=null; isOpen=false; }
function format(selection) {
  if (!selection) return '';
  if(model.unit==='time') return clockValue(selection.clock);
  if(model.clock) return dateValue(model,selection.dates[0])+' '+clockValue(selection.clock);
  return selection.dates.map(d=>dateValue(model,d)).join(' → ');
}
function refreshField() {
  field.dataset.style=$('style').value;
  field.dataset.state=field.disabled?'disabled':isOpen?'focus':committed?'active':'default';
  field.setAttribute('aria-expanded',String(isOpen));
  field.setAttribute('aria-label',($('label').checked?'標題':'日期或時間')+($('label').checked&&$('required').checked?'，必填':''));
  if($('help').checked) field.setAttribute('aria-describedby','field-help');
  else field.removeAttribute('aria-describedby');
  const value=isOpen && model.range && draft.length===1
    ? dateValue(model,draft[0])+' → 結束'
    : format(committed);
  const view=document.createElement('span');
  view.className='field-value'+(value?'':' placeholder');
  view.textContent=value || (model.range?'開始　→　結束':'開始');
  field.replaceChildren(view,pickerImage(model.unit==='time'?'time':'date','picker-suffix'));
  $('value').textContent=isOpen && model.range && draft.length===1
    ? '已選開始日期 '+dateValue(model,draft[0])+'，請選擇結束日期。'
    : '已選值：'+(format(committed) || '—');
}
function closePanel(restoreFocus) {
  isOpen=false; panel.hidden=true; drill=null; refreshField();
  if(restoreFocus && !field.disabled) field.focus();
}
function openPanel() {
  if(field.disabled) return;
  draft=committed ? committed.dates.slice() : [];
  clock=committed ? committed.clock.slice() : [0,0,0];
  anchor=draft.length ? date(draft[0].getFullYear(),draft[0].getMonth()) : normalize({unit:'date'},new Date());
  drill=null; isOpen=true; panel.hidden=false; refreshField(); renderPanel('first');
}
function commit(dates) {
  committed={dates,clock:clock.slice()};
  closePanel(true);
}
function activeTone(d) {
  const bounds = draft.length ? draft : [];
  const key = dateKey(d);
  if (model.week && bounds.length===2 && key>=dateKey(bounds[0]) && key<=dateKey(bounds[1])) return 'active';
  if (bounds.some(day=>dateKey(day)===key)) return 'active';
  if (bounds.length===2 && key>dateKey(bounds[0]) && key<dateKey(bounds[1])) return 'middle';
  return '';
}
function pick(d) {
  const value=normalize(model,d);
  if(drill==='year') {
    anchor=date(value.getFullYear(),anchor.getMonth());
    drill=model.unit==='date'?'month':null;
    renderPanel('first');
  } else if(drill==='month') {
    anchor=date(value.getFullYear(),value.getMonth()); drill=null; renderPanel('first');
  } else if(model.range) {
    if(draft.length===1) commit(rangePair(draft[0],value));
    else { draft=[value]; refreshField(); renderPanel('first'); }
  } else if(model.unit==='date' && model.clock) {
    draft=[value]; renderPanel('first');
  } else commit(model.week?weekPair(value):[value]);
}
function makeButton(label,handler,cls) {
  const button=document.createElement('button');
  button.type='button'; button.textContent=label; button.className=cls; button.addEventListener('click',handler);
  return button;
}
function nextView(d,unit) {
  return unit==='date' ? date(d.getFullYear(),d.getMonth()+1) :
    date(d.getFullYear()+(unit==='year'?10:1),d.getMonth());
}
function navHeader(d,unit) {
  const node=document.createElement('header');
  const step=unit==='year'?10:1;
  const nav=(label,asset,dy,dm)=>{
    const b=makeButton('',event=>{
      anchor=date(anchor.getFullYear()+dy,anchor.getMonth()+dm);
      renderPanel(event.currentTarget.dataset.focusKey);
    },'picker-nav');
    b.append(pickerImage(asset,'picker-nav-icon'));
    b.dataset.focusKey=label;
    b.setAttribute('aria-label',label);
    node.append(b);
  };
  nav(unit==='year'?'前十年':'前一年','prev-year',-step,0);
  if(unit==='date') nav('前一月','prev',0,-1);
  const titles=document.createElement('div');
  titles.className='picker-header-titles';
  const dates=model.range ? [d,nextView(d,unit)] : [d];
  for(const current of dates) {
    const caption=document.createElement('div');
    caption.className='picker-header-title';
    if(unit==='date' || unit==='month') {
      if(unit==='date') caption.append(makeButton(months[current.getMonth()],()=>{
        if(model.range) return;
        drill='month'; renderPanel('first');
      },'picker-heading-button'));
      caption.append(makeButton(String(current.getFullYear()),()=>{
        if(model.range) return;
        drill='year'; renderPanel('first');
      },'picker-heading-button'));
    } else {
      const label=document.createElement('span');
      const decade=Math.floor(current.getFullYear()/10)*10;
      label.textContent=unit==='year' ? decade+'–'+(decade+9) : String(current.getFullYear());
      caption.append(label);
    }
    titles.append(caption);
  }
  node.append(titles);
  if(unit==='date') nav('後一月','next',0,1);
  nav(unit==='year'?'後十年':'後一年','next-year',step,0);
  return node;
}
function makeCell(label,d,other,today,unit) {
  const b=makeButton('',()=>pick(d),'cell'+(unit==='date'?'':' unit'));
  const text=document.createElement('span'); text.textContent=label; b.append(text);
  const tone=drill?'':activeTone(d);
  const isToday=unit==='date' && today;
  b.dataset.tone=tone; b.dataset.other=String(other); b.dataset.today=String(isToday);
  b.setAttribute('aria-label',dateValue({...model,unit},d));
  b.setAttribute('aria-pressed',String(tone==='active'||tone==='middle'));
  if(isToday) b.setAttribute('aria-current','date');
  return b;
}
function calendar(d,unit) {
  const card=document.createElement('div'); card.className='calendar';
  const grid=document.createElement('div');
  grid.className='grid '+(unit==='date'?'days':'units '+unit);
  const y=d.getFullYear(),m=d.getMonth();
  const today=new Date();
  if (unit==='date') {
    for(const name of '日一二三四五六') {
      const label=document.createElement('span'); label.className='week-name'; label.textContent=name; grid.append(label);
    }
    const first=date(y,m);
    const start=addDays(first,-first.getDay());
    const rows=Math.ceil((first.getDay()+date(y,m+1,0).getDate())/7);
    for(let i=0;i<rows*7;i++) {
      const day=addDays(start,i);
      grid.append(makeCell(String(day.getDate()),day,day.getMonth()!==m,iso(day)===iso(today),unit));
    }
  } else {
    const decade=Math.floor(y/10)*10;
    const count=unit==='quarter'?4:12;
    for(let i=0;i<count;i++) {
      const item=unit==='year'?date(decade-1+i,0):date(y,unit==='quarter'?i*3:i);
      const label=unit==='year'?String(item.getFullYear()):unit==='quarter'?'Q'+(i+1):months[i];
      grid.append(makeCell(label,item,unit==='year'&&(i===0||i===11),false,unit));
    }
  }
  card.append(grid); return card;
}
function timeColumns() {
  const group=document.createElement('div'); group.className='time';
  ['小時','分鐘','秒'].forEach((part,index)=>{
    const wrapper=document.createElement('div');
    wrapper.className='time-column'; wrapper.dataset.part=String(index);
    const col=document.createElement('div');
    col.className='time-list'; col.setAttribute('role','group'); col.setAttribute('aria-label',part);
    for(let i=0;i<(index===0?24:60);i++){
      const b=makeButton(pad(i),()=>{
        clock[index]=i;
        col.querySelector('[aria-pressed="true"]')?.setAttribute('aria-pressed','false');
        b.setAttribute('aria-pressed','true');
      },'time-option');
      b.setAttribute('aria-label',pad(i)+part); b.setAttribute('aria-pressed',String(clock[index]===i));
      col.append(b);
    }
    const track=document.createElement('div');
    track.className='time-scroller'; track.setAttribute('aria-hidden','true');
    const thumb=document.createElement('div'); thumb.className='time-scrollbar';
    track.append(thumb); wrapper.append(col,track); group.append(wrapper);
    const syncThumb=()=>{
      const overflow=col.scrollHeight-col.clientHeight;
      const travel=track.clientHeight-thumb.offsetHeight;
      thumb.style.top=(overflow>0 ? col.scrollTop/overflow*Math.max(0,travel) : 0)+'px';
      track.hidden=overflow<=0;
    };
    col.addEventListener('scroll',syncThumb,{passive:true});
    track.addEventListener('pointerdown',event=>{
      if(event.button!==0) return;
      event.preventDefault();
      const travel=track.clientHeight-thumb.offsetHeight;
      if(travel<=0) return;
      const offset=event.target===thumb ? event.clientY-thumb.getBoundingClientRect().top : thumb.offsetHeight/2;
      const move=(pointer)=>{
        const top=Math.max(0,Math.min(travel,pointer.clientY-track.getBoundingClientRect().top-offset));
        col.scrollTop=top/travel*(col.scrollHeight-col.clientHeight);
        syncThumb();
      };
      const finish=()=>{
        track.removeEventListener('pointermove',move);
        track.removeEventListener('pointerup',finish);
        track.removeEventListener('pointercancel',finish);
      };
      track.setPointerCapture(event.pointerId);
      track.addEventListener('pointermove',move);
      track.addEventListener('pointerup',finish);
      track.addEventListener('pointercancel',finish);
      move(event);
    });
    col.updateScrollbar=syncThumb;
  });
  return group;
}
function renderPanel(focusKey) {
  const panes=document.createElement('div'); panes.className='panes';
  const unit=drill||model.unit;
  if (unit!=='time') panes.append(calendar(anchor,unit));
  if (model.range) {
    panes.append(calendar(nextView(anchor,unit),unit));
  }
  if (model.clock && !drill) panes.append(timeColumns());
  panel.dataset.mode=drill||modeInput.value;
  const arrow=pickerImage('arrow','picker-popup-arrow');
  panel.replaceChildren(arrow);
  if(unit!=='time') {
    const header=navHeader(anchor,unit);
    if(model.clock && !drill) {
      const row=document.createElement('div');
      row.className='picker-datetime-header';
      row.append(header);
      const blank=document.createElement('div');
      blank.className='picker-time-heading';
      row.append(blank); panel.append(row);
    } else panel.append(header);
  }
  panel.append(panes);
  const footer=document.createElement('footer');
  if (model.unit==='date' && !model.range && !model.clock && !drill) {
    footer.append(makeButton('今天',()=>commit(model.week?weekPair(normalize(model,new Date())):[normalize(model,new Date())]),'action'));
  }
  if (model.clock && !drill) {
    if(model.unit==='time') footer.append(makeButton('此刻',()=>{
      const now=new Date(); clock=[now.getHours(),now.getMinutes(),now.getSeconds()]; renderPanel('first');
    },'action'));
    const confirm=makeButton('確定',()=>commit(model.unit==='time'?[]:draft),'action primary');
    confirm.disabled=model.unit!=='time' && !draft.length;
    footer.append(confirm);
  }
  if(footer.childElementCount) panel.append(footer);
  for(const col of panel.querySelectorAll('.time-list')) {
    const selected=col.querySelector('[aria-pressed="true"]');
    col.scrollTop=selected.offsetTop-col.firstElementChild.offsetTop;
    col.updateScrollbar();
  }
  const buttons=[...panel.querySelectorAll('button:not(:disabled)')];
  const target=buttons.find(b=>b.dataset.focusKey===focusKey) || buttons.find(b=>b.classList.contains('cell')&&b.getAttribute('aria-pressed')==='true') || buttons[0];
  target?.focus({preventScroll:true});
}
function sync() {
  $('field-label').hidden=!$('label').checked;
  $('field-label').firstElementChild.hidden=!$('required').checked;
  $('field-help').hidden=!$('help').checked;
  field.disabled=$('disabled').checked;
  if(field.disabled && isOpen) closePanel(false);
  refreshField();
}
function sampleMatrix() {
  const container=$('matrix'); if(!container) return; container.replaceChildren();
  const group=Number($('samples').value);
  for(let row=0;row<6;row++) {
    const heading=document.createElement('h3');
    heading.textContent=figmaSamples[group][row*4].style+' · '+(row<3?'有標題':'無標題');
    const grid=document.createElement('div'); grid.className='field-grid';
    for(let column=0;column<4;column++) {
      const sample=document.createElement('div'); sample.className='sample';
      const source=document.createElement('a');
      const design=figmaSamples[group][row*4+column];
      const state=design.state==='Disbaled'?'disabled':design.state.toLowerCase();
      source.textContent=(state==='disabled'?'Disabled':design.state)+' · '+design.style+' ↗';
      source.href='https://www.figma.com/design/OsaDhOsncK2eM8FE6aAMkF/Syncdrive-UI-Design-Kit?node-id='+design.id.replace(':','-');
      const mock=document.createElement('button');
      mock.type='button'; mock.tabIndex=-1; mock.className='picker-field text-body-s';
      mock.dataset.style=design.style.toLowerCase(); mock.dataset.state=state;
      mock.disabled=state==='disabled';
      mock.setAttribute('aria-label','固定預覽 '+source.textContent);
      const val=document.createElement('span');
      val.className='field-value'+(state==='default'?' placeholder':'');
      val.textContent=design.text.join(' → ');
      if(row<3){const label=document.createElement('span'); label.className='picker-label text-body-s-bold'; label.innerHTML='<b aria-hidden="true">*</b>標題'; sample.append(source,label);}
      else sample.append(source);
      mock.append(val,pickerImage(group===2?'time':'date','picker-suffix')); sample.append(mock);
      const help=document.createElement('p'); help.className='picker-help text-body-xs'; help.textContent='輔助文字';
      sample.append(help); grid.append(sample);
    }
    container.append(heading,grid);
  }
}
field.addEventListener('click',()=>isOpen?closePanel(true):openPanel());
modeInput.addEventListener('change',()=>{ model=modes[modeInput.value]; reset(); closePanel(false); });
for(const id of ['style','label','required','help','disabled']) $(id).addEventListener('change',sync);
$('samples')?.addEventListener('change',sampleMatrix);
document.addEventListener('click',event=>{
  if(isOpen && !event.composedPath().includes($('stage'))) closePanel(false);
});
$('stage').addEventListener('keydown',event=>{
  if(!isOpen) return;
  if(event.key==='Escape') { event.preventDefault(); closePanel(true); }
  const item=event.target;
  if (!item.matches('.cell,.time-option')) return;
  const grid=item.parentElement;
  const items=[...grid.querySelectorAll('button')];
  const step=grid.classList.contains('days')?7:grid.classList.contains('quarter')?4:grid.classList.contains('units')?3:1;
  const change={ArrowLeft:-1,ArrowRight:1,ArrowUp:-step,ArrowDown:step}[event.key];
  if(change) {
    event.preventDefault();
    items[items.indexOf(item)+change]?.focus();
  }
});
reset();sync();sampleMatrix();
</script></body></html>
