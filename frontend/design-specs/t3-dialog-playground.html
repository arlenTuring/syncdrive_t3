.dialog-container { height:1024px; padding-top:20px; }
.dialog-container-header { flex:none; display:flex; align-items:center; gap:8px; padding:0 20px; min-height:34px; }
.dialog-container-header .dialog-title { flex:1; min-width:0; }
.dialog-container-content { display:flex; flex-direction:column; flex:1; min-height:0; gap:12px; padding:12px 20px; overflow-x:hidden; overflow-y:auto; }

.dialog-copy-wrap,.dialog-container-content { scrollbar-width:thin; scrollbar-color:var(--border-disabled) transparent; }

.t3-dialog-modal .ant-modal-body { padding:0; }
